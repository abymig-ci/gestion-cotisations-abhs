{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Créer mon mot de passe | A.B H.S</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <style>
        body { background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary) 100%); display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .custom-input { border: 2px solid #94a3b8 !important; background-color: #f8fafc !important; }
        .custom-input:focus { border-color: var(--primary) !important; box-shadow: 0 0 0 0.25rem rgba(10, 28, 92, 0.15) !important; background-color: #ffffff !important; }
    </style>
</head>
<body>
    <div class="card-custom p-5 shadow-lg" style="width: 100%; max-width: 420px; border-radius: 20px;">
        <div class="text-center mb-4">
            <img src="{% static 'img/logo.png' %}" alt="Logo" class="mb-3" style="max-width: 100px; border-radius: 50%;">
            <h4 class="fw-bold text-dark mb-1">Bienvenue !</h4>
            <p class="text-muted small">Veuillez définir votre mot de passe</p>
        </div>

        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }} py-2 small">{{ message }}</div>
            {% endfor %}
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label small fw-bold text-muted">Nouveau mot de passe</label>
                <input type="password" name="password" class="form-control form-control-lg custom-input" required minlength="8">
            </div>
            <div class="mb-4">
                <label class="form-label small fw-bold text-muted">Confirmer le mot de passe</label>
                <input type="password" name="password_confirm" class="form-control form-control-lg custom-input" required minlength="8">
            </div>
            <button type="submit" class="btn-primary-custom w-100 py-3 justify-content-center fs-6">Créer mon mot de passe</button>
        </form>
    </div>
</body>
</html>
