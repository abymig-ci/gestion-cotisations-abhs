{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Au revoir | Gestcotis</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    {% include 'pwa_head.html' %}
    <style>
        body {
            background: linear-gradient(135deg, var(--primary-dark, #0a1c5c) 0%, var(--primary, #1e5aa8) 100%);
            margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px;
        }
        .carte-aurevoir {
            width: 100%; max-width: 440px; background: #fff; border-radius: 20px; text-align: center;
            padding: 40px 32px; box-shadow: 0 20px 50px rgba(0, 0, 0, .30);
        }
        .carte-aurevoir img { width: 90px; height: 90px; object-fit: cover; border-radius: 50%; border: 3px solid #e2e8f0; margin-bottom: 16px; }
    </style>
</head>
<body>
    <div class="carte-aurevoir">
        <img src="{% static 'img/logo.png' %}" alt="Logo">
        <h4 class="fw-bold text-dark mb-2">À bientôt !</h4>
        <p class="text-muted mb-4">Vous êtes déconnecté.<span id="consigne"> Vous pouvez maintenant fermer cette fenêtre.</span></p>
        <button type="button" id="fermer" class="btn btn-outline-secondary w-100 mb-2"><i class="bi bi-x-circle"></i> Fermer</button>
        <a href="{% url 'login' %}" class="btn btn-primary w-100"><i class="bi bi-box-arrow-in-right"></i> Se reconnecter</a>
    </div>
    <script>
        function fermer() {
            window.close();
            // Si le navigateur refuse de fermer la fenêtre (cas fréquent sur téléphone), on explique quoi faire
            setTimeout(function () {
                document.getElementById('consigne').textContent =
                    " Votre navigateur ne permet pas de fermer automatiquement : revenez à l'écran d'accueil de votre téléphone ou fermez cet onglet.";
            }, 400);
        }
        document.getElementById('fermer').addEventListener('click', fermer);
    </script>
</body>
</html>
