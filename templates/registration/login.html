{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion | A.B H.S</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <style>
        body {
            background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }
    </style>
</head>
<body>
    <div class="card-custom p-5 shadow-lg" style="width: 100%; max-width: 420px; border-radius: 20px;">
        <div class="text-center mb-4">
            <img src="{% static 'img/logo.png' %}" alt="Logo" class="mb-3" style="max-width: 100px; border-radius: 50%;">
            <h4 class="fw-bold text-dark mb-1">Bienvenue</h4>
            <p class="text-muted small">Connectez-vous pour gérer vos cotisations</p>
        </div>

        {% if form.errors %}
            <div class="alert alert-danger rounded-3 text-center py-2 small fw-medium">
                Nom d'utilisateur ou mot de passe incorrect.
            </div>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label small fw-bold text-muted">Nom d'utilisateur</label>
                <input type="text" name="username" class="form-control form-control-lg bg-light border-0" required>
            </div>
            <div class="mb-4">
                <label class="form-label small fw-bold text-muted">Mot de passe</label>
                <input type="password" name="password" class="form-control form-control-lg bg-light border-0" required>
            </div>
            <button type="submit" class="btn-primary-custom w-100 py-3 justify-content-center fs-6">Se connecter</button>
        </form>
    </div>
</body>
</html>
